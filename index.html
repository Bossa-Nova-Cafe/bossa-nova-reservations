<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Bossa Nova Café — Réservations</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--vert:#123F2B;--vert-2:#0B2A1D;--or:#E9B93A;--violet:#5B2C83;--creme:#FBF6EA;--encre:#1B1B1B;--gris:#8A8579;--rouge:#B23A2A;--r:14px}
  *{box-sizing:border-box}
  html{background:var(--creme)}
  body{margin:0;background:var(--creme);color:var(--encre);font-family:Poppins,system-ui,sans-serif;font-weight:300;line-height:1.5}
  h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:0}
  header{background:var(--vert);color:var(--creme);padding:28px 20px 22px}
  header .inner{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  header h1{font-size:clamp(28px,5vw,44px);line-height:1}
  header h1 span{color:var(--or)}
  header p{margin:6px 0 0;opacity:.85;font-size:14px;line-height:1.45}
  header p .adr{opacity:.65}
  .tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  nav button{background:transparent;border:1.5px solid rgba(251,246,234,.4);color:var(--creme);padding:8px 16px;border-radius:999px;font:500 13px Poppins;cursor:pointer;margin-left:6px}
  nav button.on{background:var(--or);border-color:var(--or);color:var(--vert-2)}
  #lang{background:rgba(0,0,0,.2);border:1.5px solid rgba(251,246,234,.4);color:var(--creme);border-radius:999px;padding:8px 10px;font:500 13px Poppins;cursor:pointer}
  #lang option{color:var(--encre)}
  main{max-width:900px;margin:0 auto;padding:24px 20px 60px}
  .card{background:#fff;border-radius:var(--r);padding:22px;box-shadow:0 2px 14px rgba(18,63,43,.08);margin-bottom:18px}
  .card h2{font-size:22px;color:var(--vert)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
  .evt{border:1.5px solid #e6e1d4;border-radius:var(--r);padding:16px;cursor:pointer;transition:.15s;position:relative}
  .evt:hover,.evt.sel{border-color:var(--vert);background:#F3F7F4}
  .evt .date{font-family:Anton;font-size:30px;line-height:1;color:var(--vert)}
  .evt .mois{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--gris)}
  .evt h3{font-size:17px;margin:8px 0 4px;letter-spacing:.03em}
  .evt .meta{font-size:13px;color:var(--gris)}
  .evt .vignette{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;margin-bottom:12px;display:block;background:#f0ece1}
  .evt .desc{font-size:13px;color:var(--gris);margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #formImg{width:210px;aspect-ratio:3/2;object-fit:cover;border-radius:12px;float:right;margin:0 0 14px 18px;background:#f0ece1}
  #formDesc{font-size:15px;margin:10px 0 0}
  .vignetteAdm{width:78px;height:52px;object-fit:cover;border-radius:8px;float:left;margin:2px 12px 0 0;background:#f0ece1}
  .type{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:8px}
  .type.music{background:#F3EEF9;color:var(--violet)}
  .type.match{background:#FDF3D6;color:#8A6100}
  .type.feijoada{background:#FBE7DC;color:#9C4A21}
  .type.culture{background:#E2EEF4;color:#1F5A78}
  .jauge{height:6px;background:#eee8d9;border-radius:3px;margin-top:10px;overflow:hidden}
  .jauge i{display:block;height:100%;background:var(--or)}
  .jauge i.full{background:var(--rouge)}
  .badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--rouge);color:#fff;text-transform:uppercase;letter-spacing:.08em}
  .badge.ferme{background:var(--gris)}
  label{display:block;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--gris);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid #e6e1d4;border-radius:10px;font:400 15px Poppins;background:#fff;color:var(--encre)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--or);border-color:var(--or)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tel{display:flex;gap:8px}
  .tel select{width:auto;flex:0 0 130px;padding-right:4px}
  .btn{background:var(--vert);color:var(--creme);border:0;padding:13px 22px;border-radius:999px;font:600 14px Poppins;cursor:pointer;margin-top:18px}
  .btn:hover{background:var(--vert-2)}
  .btn.or{background:var(--or);color:var(--vert-2)}
  .btn.ghost{background:transparent;color:var(--vert);border:1.5px solid var(--vert)}
  .btn.sm{padding:7px 14px;font-size:12px;margin-top:0}
  .btn.danger{background:transparent;color:var(--rouge);border:1.5px solid var(--rouge)}
  .btn.wa{background:#25D366;color:var(--vert-2);border:0}
  .btn.wa:hover{background:#1EBE5B}
  .btn.wa[disabled]{background:#e6e1d4;color:var(--gris);cursor:not-allowed}
  .slots{display:flex;gap:8px;flex-wrap:wrap}
  .slot{padding:9px 16px;border:1.5px solid #e6e1d4;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;background:#fff}
  .slot.sel{background:var(--violet);color:#fff;border-color:var(--violet)}
  .note{font-size:13px;color:var(--gris);margin-top:6px}
  .okActs{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .okActs .btn{margin-top:0;flex:1 1 auto}
  a.ics{display:inline-block;margin-top:12px;font-size:13px;color:var(--gris);text-decoration:underline}
  .ok{background:#EAF3EC;border-left:4px solid var(--vert);padding:16px;border-radius:10px}
  .err{color:var(--rouge);font-size:13px;margin-top:8px;font-weight:500}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gris);padding:8px 6px;border-bottom:1.5px solid #e6e1d4}
  td{padding:9px 6px;border-bottom:1px solid #f0ece1;vertical-align:top}
  .stat{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0}
  .stat b{display:block;font-family:Anton;font-size:30px;color:var(--vert);line-height:1}
  .stat span{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--gris)}
  .empty{text-align:center;color:var(--gris);padding:30px}
  h3.passes{font-size:13px;letter-spacing:.14em;color:var(--gris);margin:26px 0 -6px;padding-top:18px;border-top:2px solid #e6e1d4}
  .chip{display:inline-block;background:#F3EEF9;color:var(--violet);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500;margin:2px 2px 0 0}
  .flag{display:inline-block;background:#f0ece1;color:var(--gris);font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;margin-left:6px}
  .hidden{display:none}
  .modal{position:fixed;inset:0;background:rgba(11,42,29,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
  .modal.hidden{display:none}
  .modal .box{background:#fff;border-radius:var(--r);padding:24px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .modal p{margin:0 0 18px;font-size:16px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end}
  .modal .btn{margin-top:0}
  .modal textarea{font:400 12px/1.4 ui-monospace,monospace;margin-bottom:14px}
  @media(max-width:600px){
    body{font-size:16px}
    header{padding:20px 16px 18px}
    header p{font-size:13px}
    main{padding:18px 14px 50px}
    .card{padding:18px 16px}
    .card h2{font-size:20px}
    .row{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
    .note{font-size:14px}
    label{font-size:13px;margin:14px 0 6px}
    input,select,textarea{font-size:16px;padding:13px}
    .tel select{flex:0 0 122px}
    .evt{padding:18px}
    #formImg{float:none;width:100%;margin:0 0 14px}
    #formDesc{font-size:16px}
    .evt .date{font-size:36px}
    .evt .mois{font-size:13px}
    .evt h3{font-size:19px}
    .evt .meta{font-size:15px}
    .type{font-size:11px}
    .slot{font-size:16px;padding:12px 20px}
    .btn{font-size:16px;padding:15px 24px;width:100%}
    .btn.sm{width:auto;font-size:13px;padding:9px 16px}
    .ok{font-size:16px}
    .okActs{flex-direction:column}
    .okActs .btn{width:100%}
    .stat b{font-size:26px}
    /* tableau des réservations : une carte par ligne */
    table,tbody,tr,td{display:block;width:100%}
    thead{display:none}
    table{margin-top:14px}
    tr{border:1.5px solid #e6e1d4;border-radius:12px;padding:10px 14px;margin-bottom:12px}
    td{border:0;padding:6px 0;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:14px;text-align:right}
    td:before{content:attr(data-l);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--gris);text-align:left;flex:0 0 auto}
    td.acts{display:flex;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid #f0ece1;margin-top:6px}
    td.acts:before{content:none}
  }
</style>
</head>
<body>
<header><div class="inner">
  <div><h1>Bossa Nova <span>Café</span></h1>
    <p>Music Night · Match Night · Feijoada · Culture<br><span class="adr">Place de la Gare 3, 1800 Vevey</span></p></div>
  <div class="tools">
    <select id="lang" onchange="setLang(this.value)" aria-label="Language"></select>
    <nav><button id="tabPub" class="on" onclick="go('pub')"></button><button id="tabAdm" onclick="go('adm')"></button></nav>
  </div>
</div></header>

<main>
<section id="pub">
  <div class="card">
    <h2 id="t_choisir"></h2>
    <p class="note" id="t_intro"></p>
    <div id="pubList" class="grid"></div>
  </div>
  <div id="formCard" class="card hidden">
    <img id="formImg" class="hidden" alt="" loading="lazy">
    <h2 id="formTitle"></h2>
    <p class="note" id="formMeta"></p>
    <p id="formDesc"></p>
    <label id="t_heure"></label>
    <div class="slots" id="slotPick"></div>
    <div class="row">
      <div><label id="t_nom"></label><input id="fNom"></div>
      <div><label id="t_pax"></label><select id="fPax"></select></div>
    </div>
    <div class="row">
      <div><label id="t_tel"></label><div class="tel"><select id="fInd"></select><input id="fTel" type="tel" inputmode="tel"></div></div>
      <div><label id="t_mail"></label><input id="fMail" type="email" placeholder="…@…"></div>
    </div>
    <label id="t_note"></label><textarea id="fNote" rows="2"></textarea>
    <div class="err" id="fErr"></div>
    <button class="btn or" id="t_valider" onclick="reserver()"></button>
  </div>
  <div id="okCard" class="card hidden"><div class="ok" id="okMsg"></div>
    <div class="okActs">
      <button class="btn or" id="t_agenda" onclick="agenda()"></button>
      <button class="btn wa" id="t_inviter" onclick="inviter()"></button>
    </div>
    <a href="#" class="ics" id="t_ics" onclick="icsFile();return false"></a>
    <button class="btn ghost" id="t_nouvelle" onclick="go('pub')"></button></div>
</section>

<section id="adm" class="hidden">
  <div class="card" id="loginCard">
    <h2>Espace gestion</h2>
    <p class="note">Réservé à l'équipe du Bossa Nova Café.</p>
    <div class="row">
      <div><label>E-mail</label><input id="lMail" type="email" autocomplete="username"></div>
      <div><label>Mot de passe</label><input id="lPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    </div>
    <div class="err" id="lErr"></div>
    <button class="btn" onclick="login()">Se connecter</button>
  </div>
  <div id="admContent" class="hidden">
  <div style="text-align:right;margin-bottom:10px"><span class="note" id="whoami"></span>
    <button class="btn sm ghost" onclick="auth.signOut()">Déconnexion</button></div>
  <div class="card">
    <h2>Nouvel événement</h2>
    <div class="row">
      <div><label>Type d'événement</label><select id="aType" onchange="preremplir()"><option value="music">Music Night</option><option value="match">Match Night</option><option value="feijoada">Feijoada</option><option value="culture">Culture</option></select></div>
      <div><label>Titre</label><input id="aTitre" placeholder="Ex. Samba de roda avec …"></div>
    </div>
    <div class="row">
      <div><label>Date</label><input id="aDate" type="date"></div>
      <div><label>Début</label><input id="aDebut" type="time" value="20:00"></div>
    </div>
    <div class="row">
      <div><label>Fin</label><input id="aFin" type="time" value="23:00"></div>
      <div><label>Dernier jour pour réserver</label><input id="aLimit" type="date"></div>
    </div>
    <div class="row">
      <div><label>Capacité totale</label><input id="aCap" type="number" value="40" min="2"></div>
      <div><label>Minimum par réservation</label><input id="aMin" type="number" value="2" min="1"></div>
    </div>
    <label>Heures d'arrivée proposées</label>
    <input id="aSlots" value="19:30, 20:00, 20:30">
    <label>Image 3:2 — adresse (optionnel)</label>
    <input id="aImg" placeholder="https://bossa-nova-cafe.github.io/bossa-nova-reservations/samba.jpg">
    <label>Description (optionnel)</label>
    <textarea id="aDesc" rows="3" placeholder="Quelques lignes présentées au client : le groupe, le menu, l'invité…"></textarea>
    <p class="note">Séparez les heures par des virgules. Ce sont les créneaux proposés aux clients.</p>
    <div class="err" id="aErr"></div>
    <button class="btn" onclick="creerSoiree()">Créer l'événement</button>
  </div>
  <div class="card">
    <h2>Événements programmés</h2>
    <div id="admList"></div>
  </div>
  </div>
</section>
</main>

<div id="modal" class="modal hidden"><div class="box"><p id="modalMsg"></p><div id="modalExtra"></div><div class="acts" id="modalActs"></div></div></div>

const TYPES={music:{nom:'Music Night',titre:'Ex. Samba de roda avec …',debut:'20:00',fin:'23:00',slots:'19:30, 20:00, 20:30',min:2},
             match:{nom:'Match Night',titre:'Ex. Brésil – Argentine',debut:'20:00',fin:'23:00',slots:'19:00, 19:30, 20:00',min:2},
             feijoada:{nom:'Feijoada',titre:'Ex. Feijoada complète',debut:'12:00',fin:'15:00',slots:'11:30, 12:00, 12:30, 13:00',min:2},

const today=()=>new Date().toLocaleDateString('sv-SE');
function dfull(d,l){const x=new Date(d+'T12:00');return new Intl.DateTimeFormat(LOC[l||lang],{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(x);}
function dmois(d){const x=new Date(d+'T12:00');return new Intl.DateTimeFormat(LOC[lang],{month:'short'}).format(x)+' '+x.getFullYear();}
function pax(ev){return ev.pax||0;}
function reste(ev){return ev.cap-pax(ev);}
function fini(ev){return new Date(ev.date+'T'+(ev.fin||'23:59'))<new Date();}
function ouverte(ev){return !ev.ferme && !fini(ev) && (!ev.limit||ev.limit>=today()) && reste(ev)>=ev.min;}

let cible=new URLSearchParams(location.search).get('e'), cibleFaite=false;
function render(){
  const upcoming=events.filter(e=>!fini(e)).sort((a,b)=>a.date.localeCompare(b.date));
  $('pubList').innerHTML=upcoming.length?upcoming.map(ev=>{
    const x=new Date(ev.date+'T12:00'), r=reste(ev), full=r<ev.min, pct=Math.min(100,pax(ev)/ev.cap*100);
    const badge=ev.ferme?`<span class="badge ferme">${t('Ferme')}</span>`:full?`<span class="badge">${t('Complet')}</span>`:'';
    return `<div class="evt ${selEv&&selEv.id===ev.id?'sel':''}" onclick="choisir('${ev.id}')">${badge}
      ${ev.img?`<img class="vignette" src="${esc(ev.img)}" alt="" loading="lazy" onerror="this.remove()">`:''}
      <div class="type ${ev.type||'music'}">${TYPES[ev.type||'music'].nom}</div>
      <div class="date">${x.getDate()}</div><div class="mois">${dmois(ev.date)}</div>
      <h3>${esc(ev.titre)}</h3><div class="meta">${ev.debut} – ${ev.fin} · ${full?t('complet'):t('restantes')(r)}</div>
      ${ev.desc?`<div class="desc">${esc(ev.desc)}</div>`:''}
      <div class="jauge"><i class="${full?'full':''}" style="width:${pct}%"></i></div></div>`;
  }).join(''):`<div class="empty">${t('vide')}</div>`;
  if(isAdmin) renderAdm();
  if(cible&&!cibleFaite&&events.some(e=>e.id===cible)){cibleFaite=true;choisir(cible);}

function choisir(id){
  const ev=events.find(e=>e.id===id); if(!ev||!ouverte(ev)) return;
  selEv=ev; selSlot=null; $('okCard').classList.add('hidden'); $('formCard').classList.remove('hidden');
  const im=$('formImg');
  if(ev.img){im.src=ev.img;im.classList.remove('hidden');im.onerror=()=>im.classList.add('hidden');}
  else im.classList.add('hidden');
  $('formDesc').textContent=ev.desc||'';
  $('formTitle').textContent=ev.titre;
  $('formMeta').textContent=`${dfull(ev.date)} · ${ev.debut} – ${ev.fin} · ${t('restantes')(reste(ev))}`;
  $('slotPick').innerHTML=ev.slots.map(s=>`<span class="slot" onclick="pickSlot(this,'${s}')">${s}</span>`).join('');
  const max=Math.min(reste(ev),12); let o='';
  for(let n=ev.min;n<=max;n++) o+=`<option value="${n}">${t('pers')(n)}${n===ev.min&&ev.min>1?' '+t('table'):''}</option>`;
  $('fPax').innerHTML=o; $('fErr').textContent=''; render();
  $('formCard').scrollIntoView({behavior:'smooth'});
}
function pickSlot(el,s){selSlot=s;[...$('slotPick').children].forEach(c=>c.classList.remove('sel'));el.classList.add('sel');}
function telComplet(){
  let n=$('fTel').value.replace(/[^\d]/g,''); if(!n) return '';
  const ind=$('fInd').value;
  if(n.startsWith('00')) n=n.slice(2); else if(n.startsWith('0')) n=n.slice(1);
  if(n.startsWith(ind)) n=n.slice(ind.length);
  return '+'+ind+' '+n;
}
async function reserver(){
  const ev=selEv, n=+$('fPax').value;
  const nom=$('fNom').value.trim(), tel=telComplet(), mail=$('fMail').value.trim();
  let err='';
  if(!selSlot) err=t('eSlot'); else if(!nom) err=t('eNom'); else if(!tel&&!mail) err=t('eContact');
  if(err){$('fErr').textContent=err;return;}
  const code='BN-'+Math.random().toString(36).slice(2,6).toUpperCase();
  const evRef=EV.doc(ev.id), langue=lang;
  try{
    await db.runTransaction(async tr=>{
      const snap=await tr.get(evRef), d=snap.data();
      if(!d||d.ferme) throw new Error(t('Ferme'));
      if(n<d.min) throw new Error(t('eMin')(d.min));
      const libre=d.cap-(d.pax||0);
      if(n>libre) throw new Error(libre<d.min?t('Complet'):t('ePlaces')(libre));
      tr.update(evRef,{pax:(d.pax||0)+n});
      tr.set(RS.doc(),{ev:ev.id,code,nom,tel,mail,pax:n,slot:selSlot,note:$('fNote').value.trim(),lang:langue,ts:new Date().toISOString()});
    });
  }catch(e){ $('fErr').textContent=e.message||'Réservation impossible, réessayez.'; return; }
  derniere={ev,n,code,slot:selSlot};
  $('formCard').classList.add('hidden'); $('okCard').classList.remove('hidden');
  $('okMsg').innerHTML=`<b>${t('okTitre')(code)}</b><br>${esc(nom)}, ${t('pers')(n)}, ${esc(ev.titre)}<br>${dfull(ev.date)}, ${t('arrivee')} ${selSlot}.<br><span class="note">${t('attendons')}</span>`;
  ['fNom','fTel','fMail','fNote'].forEach(i=>$(i).value=''); selSlot=null; selEv=null;
}

function icsFile(){
  const d=derniere; if(!d) return;

    'UID:'+d.code+'@bossanova-cafe',
    'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',

  const a=document.createElement('a'); a.href=url; a.download='bossa-nova-cafe.ics';
  document.body.appendChild(a); a.click(); a.remove();

}

async function creerSoiree(){
  const type=$('aType').value, titre=$('aTitre').value.trim(), date=$('aDate').value, debut=$('aDebut').value, fin=$('aFin').value;
  const cap=+$('aCap').value, min=+$('aMin').value, limit=$('aLimit').value;
  const img=$('aImg').value.trim(), desc=$('aDesc').value.trim();
  const slots=$('aSlots').value.split(',').map(s=>s.trim()).filter(s=>/^\d{1,2}:\d{2}$/.test(s));
  let err='';
  if(!titre) err="Donnez un titre à l'événement."; else if(!date) err='La date est requise.';
  else if(debut>=fin) err="L'heure de fin doit suivre l'heure de début."; else if(cap<min) err='La capacité doit être supérieure au minimum.';
  else if(!slots.length) err="Indiquez au moins une heure d'arrivée (ex. 20:00).";
  if(err){$('aErr').textContent=err;return;} $('aErr').textContent='';
  try{ await EV.add({type,titre,date,debut,fin,cap,min,slots,limit,img,desc,ferme:false,pax:0}); }
  catch(e){ $('aErr').textContent='Enregistrement refusé : '+e.message; return; }
  $('aTitre').value='';$('aDate').value='';$('aLimit').value='';$('aImg').value='';$('aDesc').value='';
}

    const p=pax(ev);
    return `<div style="border-top:1.5px solid #e6e1d4;padding:18px 0">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div>${ev.img?`<img class="vignetteAdm" src="${esc(ev.img)}" alt="" loading="lazy" onerror="this.remove()">`:''}<div class="type ${ev.type||'music'}">${TYPES[ev.type||'music'].nom}</div>
        <h3 style="font-size:18px;color:var(--vert)">${esc(ev.titre)}</h3>
        <div class="note">${dfull(ev.date,'fr')} · ${ev.debut} – ${ev.fin} · min. ${ev.min} pers.${ev.limit?" · réservations jusqu'au "+ev.limit:''}</div>
        <div style="margin-top:4px">${ev.slots.map(s=>`<span class="chip">${s}</span>`).join('')}</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm ghost" onclick="toggleFerme('${ev.id}')">${ev.ferme?'Rouvrir':'Fermer les réservations'}</button>
          <button class="btn sm ghost" onclick="lienEv('${ev.id}')">Lien à partager</button>
          <button class="btn sm ghost" onclick="pageEv('${ev.id}')">Page réseaux sociaux</button>
          <button class="btn sm ghost" onclick="exporter('${ev.id}')">Copier la liste</button>
          <button class="btn sm danger" onclick="supprSoiree('${ev.id}')">Supprimer</button></div>
      </div>
      <div class="stat"><div><b>${p}</b><span>personnes</span></div><div><b>${rs.length}</b><span>réservations</span></div><div><b>${ev.cap-p}</b><span>places libres</span></div></div>
      ${rs.length?`<table><thead><tr><th>Arrivée</th><th>Nom</th><th>Pers.</th><th>Contact</th><th>Remarque</th><th>Code</th><th></th></tr></thead><tbody>
        ${rs.map(r=>`<tr><td data-l="Arrivée">${r.slot}</td><td data-l="Nom">${esc(r.nom)}<span class="flag">${(r.lang||'fr').toUpperCase()}</span></td><td data-l="Pers.">${r.pax}</td>
        <td data-l="Contact">${esc(r.tel)}${r.tel&&r.mail?'<br>':''}${esc(r.mail)}</td><td data-l="Remarque">${esc(r.note)}</td><td data-l="Code">${r.code}</td>
        <td class="acts" style="white-space:nowrap"><button class="btn sm wa" onclick="wa('${r.id}')" ${numeroWa(r.tel)?'':'disabled title="Pas de numéro"'}>WhatsApp</button>
        <button class="btn sm danger" onclick="supprResa('${r.id}')">Annuler</button></td></tr>`).join('')}</tbody></table>`
        :'<div class="note">Aucune réservation pour l\'instant.</div>'}
    </div>`;
  };
  c.innerHTML=(avenir.length?avenir.map(carte).join(''):'<div class="empty">Aucun événement à venir.</div>')
    +(passes.length?`<h3 class="passes">Passés (${passes.length})</h3>`+passes.map(carte).join(''):'');
}
function toggleFerme(id){const ev=events.find(e=>e.id===id);if(ev)EV.doc(id).update({ferme:!ev.ferme});}
async function supprSoiree(id){
  if(!await ask('Supprimer cet événement et toutes ses réservations ? Cette action est définitive.'))return;
  const b=db.batch(); resas.filter(r=>r.ev===id).forEach(r=>b.delete(RS.doc(r.id))); b.delete(EV.doc(id)); await b.commit();
}
async function supprResa(id){
  if(!await ask('Annuler cette réservation ? La place sera de nouveau disponible.','Annuler la réservation'))return;
  const r=resas.find(x=>x.id===id); if(!r) return;
  const b=db.batch(); b.delete(RS.doc(id));
  b.update(EV.doc(r.ev),{pax:firebase.firestore.FieldValue.increment(-r.pax)}); await b.commit();
}

/* ---- WhatsApp ---- */
function numeroWa(tel){
  let n=String(tel||'').replace(/[^\d+]/g,'');
  if(n.startsWith('+')) n=n.slice(1); else if(n.startsWith('00')) n=n.slice(2); else if(n.startsWith('0')) n='41'+n.slice(1);
  return n.length>=8?n:'';
}
function wa(id){
  const r=resas.find(x=>x.id===id); if(!r) return;
  const ev=events.find(e=>e.id===r.ev), n=numeroWa(r.tel);
  if(!n){ info('Aucun numéro de téléphone utilisable pour cette réservation.'); return; }
  const msg=(WA[r.lang]||WA.fr)(r,ev);
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg)}`,'_blank');
}
function slug(s){
  return (s||'evenement').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
}
function pageEv(id){
  const ev=events.find(e=>e.id===id); if(!ev) return;
  const base=lienSite(), a=s=>String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const nom=TYPES[ev.type||'music'].nom;
  const titre=`${nom} — ${ev.titre} · Bossa Nova Café`;
  const desc=(ev.desc||`${dfull(ev.date,'fr')}, ${ev.debut} – ${ev.fin}. Place de la Gare 3, 1800 Vevey. Réservation en ligne.`).replace(/\s+/g,' ').slice(0,300);
  const img=ev.img||'';
  const fichier=slug(ev.titre)+'.html';
  const url=base+fichier;
  const dest=base+'?e='+id;
  const html=`<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${a(titre)}</title>
<meta name="description" content="${a(desc)}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bossa Nova Café">
<meta property="og:title" content="${a(titre)}">
<meta property="og:description" content="${a(desc)}">${img?`
<meta property="og:image" content="${a(img)}">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="532">`:''}
<meta property="og:url" content="${a(url)}">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="${a(url)}">
<meta http-equiv="refresh" content="0; url=${a(dest)}">
<style>body{font-family:system-ui,sans-serif;background:#FBF6EA;color:#123F2B;display:grid;place-items:center;height:100vh;margin:0;text-align:center;padding:20px}a{color:#123F2B}</style>
</head>
<body>
<div><p>Redirection vers la réservation…</p>
<p><a href="${a(dest)}">${a(nom)} — ${a(ev.titre)}</a></p></div>
<script>location.replace(${JSON.stringify(dest)});<\/script>
</body>
</html>`;
  info(`Créez sur GitHub un fichier nommé « ${fichier} » et collez-y ce contenu. Le lien à partager sera alors : ${url}`, html);
}
function lienEv(id){
  const ev=events.find(e=>e.id===id); const u=lienSite()+'?e='+id;
  const msg=`${TYPES[ev.type||'music'].nom} — ${ev.titre}\n${dfull(ev.date,'fr')}, ${ev.debut} – ${ev.fin}\nBossa Nova Café, Place de la Gare 3, 1800 Vevey\n\nRéservations : ${u}`;
  info("Lien direct vers cet événement — à coller sur Instagram, Facebook ou dans un message.",u+'\n\n— — —\n\n'+msg);
}
function exporter(id){
  const ev=events.find(e=>e.id===id); const rs=resas.filter(r=>r.ev===id).sort((a,b)=>a.slot.localeCompare(b.slot));
  const txt=[`${TYPES[ev.type||'music'].nom} — ${ev.titre} — ${dfull(ev.date,'fr')}`,
    'Arrivée\tNom\tLangue\tPers.\tTéléphone\tE-mail\tRemarque\tCode',
    ...rs.map(r=>[r.slot,r.nom,(r.lang||'fr').toUpperCase(),r.pax,r.tel,r.mail,r.note,r.code].join('\t'))].join('\n');
  try{ navigator.clipboard.writeText(txt).then(()=>info('Liste copiée — collez-la dans Excel ou un e-mail.'),()=>info('Sélectionnez le texte et copiez-le.',txt)); }
  catch(e){ info('Sélectionnez le texte et copiez-le.',txt); }
}
